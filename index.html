<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Hub</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: Arial, sans-serif;
            padding: 20px;
            min-height: 100vh;
        }
        
        h1 { color: white; text-align: center; margin-bottom: 10px; font-size: 2.5em; }
        p { color: white; text-align: center; margin-bottom: 40px; }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            max-width: 1000px;
            margin: 0 auto;
        }
        
        .card {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        .card:hover { transform: scale(1.05); }
        
        .emoji {
            width: 100%;
            height: 150px;
            font-size: 5em;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        .title {
            padding: 15px;
            text-align: center;
            font-weight: bold;
            color: #333;
        }
        
        button {
            width: 90%;
            margin: 10px auto;
            padding: 10px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            display: block;
            font-weight: bold;
        }
        
        button:hover { background: #764ba2; }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 999;
            align-items: center;
            justify-content: center;
        }
        
        .modal.show { display: flex; }
        
        .modal-content {
            background: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            position: relative;
            max-width: 90vw;
            max-height: 90vh;
            overflow: auto;
        }
        
        .close-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 30px;
            cursor: pointer;
            color: #333;
            background: none;
            border: none;
            width: auto;
            margin: 0;
            padding: 0;
        }
    </style>
</head>
<body>
    <h1>🎮 Game Hub</h1>
    <p>Click a game to play!</p>
    
    <div class="grid">
        <div class="card" onclick="playSnake()">
            <div class="emoji">🐍</div>
            <div class="title">Snake</div>
            <button>Play</button>
        </div>
        
        <div class="card" onclick="playFlappy()">
            <div class="emoji">🐦</div>
            <div class="title">Flappy Bird</div>
            <button>Play</button>
        </div>
        
        <div class="card" onclick="playPong()">
            <div class="emoji">🏓</div>
            <div class="title">Pong</div>
            <button>Play</button>
        </div>
        
        <div class="card" onclick="playBreakout()">
            <div class="emoji">🧱</div>
            <div class="title">Breakout</div>
            <button>Play</button>
        </div>
    </div>
    
    <div id="modal" class="modal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeGame()">&times;</button>
            <h2 id="title"></h2>
            <div id="game"></div>
        </div>
    </div>

    <script>
        function closeGame() { 
            document.getElementById('modal').classList.remove('show');
            document.onkeydown = null;
            document.onmousemove = null;
        }
        
        function playSnake() {
            document.getElementById('title').textContent = '🐍 Snake';
            document.getElementById('game').innerHTML = '<canvas id="c" width="400" height="400"></canvas><p>Use Arrow Keys</p>';
            document.getElementById('modal').classList.add('show');
            
            const c = document.getElementById('c');
            const ctx = c.getContext('2d');
            let s = [{x:10,y:10}], f = {x:15,y:15}, dx = 1, dy = 0, score = 0;
            
            document.onkeydown = (e) => {
                if(e.key === 'ArrowUp' && dy === 0) dx = 0, dy = -1;
                if(e.key === 'ArrowDown' && dy === 0) dx = 0, dy = 1;
                if(e.key === 'ArrowLeft' && dx === 0) dx = -1, dy = 0;
                if(e.key === 'ArrowRight' && dx === 0) dx = 1, dy = 0;
            };
            
            let loop = setInterval(() => {
                let h = {x:s[0].x+dx, y:s[0].y+dy};
                if(h.x<0||h.x>19||h.y<0||h.y>19||s.some(p=>p.x===h.x&&p.y===h.y)) {
                    clearInterval(loop);
                    alert('Game Over! Score: '+score);
                    closeGame();
                    return;
                }
                s.unshift(h);
                if(h.x===f.x&&h.y===f.y) {
                    score++;
                    f = {x:Math.floor(Math.random()*20),y:Math.floor(Math.random()*20)};
                } else s.pop();
                
                ctx.fillStyle = '#000';
                ctx.fillRect(0,0,400,400);
                ctx.fillStyle = '#0f0';
                s.forEach(p => ctx.fillRect(p.x*20+1,p.y*20+1,18,18));
                ctx.fillStyle = '#f00';
                ctx.fillRect(f.x*20+1,f.y*20+1,18,18);
                ctx.fillStyle = '#fff';
                ctx.font = '16px Arial';
                ctx.fillText('Score: '+score,10,25);
            }, 100);
        }
        
        function playFlappy() {
            document.getElementById('title').textContent = '🐦 Flappy Bird';
            document.getElementById('game').innerHTML = '<canvas id="c" width="400" height="600"></canvas><p>Click or Space to jump</p>';
            document.getElementById('modal').classList.add('show');
            
            const c = document.getElementById('c');
            const ctx = c.getContext('2d');
            let b = {y:300,v:0}, p = [], score = 0;
            
            const jump = () => b.v = -12;
            document.onkeydown = (e) => {if(e.code==='Space') jump();};
            document.onmousedown = jump;
            
            let loop = setInterval(() => {
                b.v += 0.6;
                b.y += b.v;
                
                if(b.y > 600 || b.y < 0) {
                    clearInterval(loop);
                    alert('Game Over! Score: '+score);
                    closeGame();
                    return;
                }
                
                if(p.length === 0 || p[p.length-1].x < 150) {
                    p.push({x:400, y:Math.random()*250+50});
                }
                
                p = p.filter(pipe => {
                    pipe.x -= 5;
                    if(pipe.x + 60 < 0) { score++; return false; }
                    if(50 > pipe.x && 50 < pipe.x+60) {
                        if(b.y < pipe.y || b.y > pipe.y+120) {
                            clearInterval(loop);
                            alert('Game Over! Score: '+score);
                            closeGame();
                        }
                    }
                    return true;
                });
                
                ctx.fillStyle = '#87ceeb';
                ctx.fillRect(0,0,400,600);
                ctx.fillStyle = '#228b22';
                p.forEach(pipe => {
                    ctx.fillRect(pipe.x,0,60,pipe.y);
                    ctx.fillRect(pipe.x,pipe.y+120,60,600);
                });
                ctx.fillStyle = '#ffeb3b';
                ctx.fillRect(40,b.y-10,20,20);
                ctx.fillStyle = '#fff';
                ctx.font = '20px Arial';
                ctx.fillText('Score: '+score,20,40);
            }, 30);
        }
        
        function playPong() {
            document.getElementById('title').textContent = '🏓 Pong';
            document.getElementById('game').innerHTML = '<canvas id="c" width="600" height="400"></canvas><p>P1: W/S | P2: ↑/↓</p>';
            document.getElementById('modal').classList.add('show');
            
            const c = document.getElementById('c');
            const ctx = c.getContext('2d');
            let p1 = {y:175,h:50}, p2 = {y:175,h:50}, ball = {x:300,y:200,vx:4,vy:4,r:8}, score = [0,0];
            let keys = {};
            
            document.onkeydown = (e) => keys[e.key] = true;
            document.onkeyup = (e) => keys[e.key] = false;
            
            setInterval(() => {
                if(keys['w'] && p1.y > 0) p1.y -= 6;
                if(keys['s'] && p1.y + p1.h < 400) p1.y += 6;
                if(keys['ArrowUp'] && p2.y > 0) p2.y -= 6;
                if(keys['ArrowDown'] && p2.y + p2.h < 400) p2.y += 6;
                
                ball.x += ball.vx;
                ball.y += ball.vy;
                
                if(ball.y < ball.r || ball.y > 400-ball.r) ball.vy *= -1;
                if(ball.x < 20 && ball.y > p1.y && ball.y < p1.y+p1.h) ball.vx *= -1;
                if(ball.x > 580 && ball.y > p2.y && ball.y < p2.y+p2.h) ball.vx *= -1;
                
                if(ball.x < 0) {score[1]++; ball = {x:300,y:200,vx:4,vy:4,r:8};}
                if(ball.x > 600) {score[0]++; ball = {x:300,y:200,vx:4,vy:4,r:8};}
                
                ctx.fillStyle = '#000';
                ctx.fillRect(0,0,600,400);
                ctx.fillStyle = '#fff';
                ctx.fillRect(10,p1.y,10,p1.h);
                ctx.fillRect(580,p2.y,10,p2.h);
                ctx.beginPath();
                ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);
                ctx.fill();
                ctx.font = '24px Arial';
                ctx.fillText(score[0],100,50);
                ctx.fillText(score[1],500,50);
            }, 30);
        }
        
        function playBreakout() {
            document.getElementById('title').textContent = '🧱 Breakout';
            document.getElementById('game').innerHTML = '<canvas id="c" width="500" height="600"></canvas><p>Move mouse to control paddle</p>';
            document.getElementById('modal').classList.add('show');
            
            const c = document.getElementById('c');
            const ctx = c.getContext('2d');
            let pad = {x:225,y:560,w:50,h:15}, ball = {x:250,y:545,vx:3,vy:-3,r:6};
            let bricks = [], score = 0;
            
            for(let r=0; r<4; r++) {
                for(let col=0; col<8; col++) {
                    bricks.push({x:20+col*60,y:40+r*20,w:50,h:15,active:true});
                }
            }
            
            document.onmousemove = (e) => {
                const rect = c.getBoundingClientRect();
                pad.x = Math.max(0,Math.min(450,e.clientX-rect.left-pad.w/2));
            };
            
            setInterval(() => {
                ball.x += ball.vx;
                ball.y += ball.vy;
                
                if(ball.x < ball.r || ball.x > 500-ball.r) ball.vx *= -1;
                if(ball.y < ball.r) ball.vy *= -1;
                if(ball.y > 585 && ball.x > pad.x && ball.x < pad.x+pad.w) ball.vy *= -1;
                if(ball.y > 600) { alert('Game Over! Score: '+score); closeGame(); return; }
                
                bricks.forEach(b => {
                    if(!b.active) return;
                    if(ball.x > b.x && ball.x < b.x+b.w && ball.y > b.y && ball.y < b.y+b.h) {
                        b.active = false;
                        score += 10;
                        ball.vy *= -1;
                    }
                });
                
                ctx.fillStyle = '#000';
                ctx.fillRect(0,0,500,600);
                bricks.forEach(b => {
                    if(b.active) {
                        ctx.fillStyle = '#ff6b6b';
                        ctx.fillRect(b.x,b.y,b.w,b.h);
                    }
                });
                ctx.fillStyle = '#00ff88';
                ctx.fillRect(pad.x,pad.y,pad.w,pad.h);
                ctx.fillStyle = '#ffeb3b';
                ctx.beginPath();
                ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);
                ctx.fill();
                ctx.fillStyle = '#fff';
                ctx.font = '20px Arial';
                ctx.fillText('Score: '+score,20,30);
            }, 30);
        }
        
        window.onclick = (e) => {
            if(e.target === document.getElementById('modal')) closeGame();
        };
    </script>
</body>
</html>
