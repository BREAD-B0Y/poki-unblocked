<!DOCTYPE html>
<html>
<head>
<title>Games</title>
<style>
body { background: #667eea; color: white; font-family: Arial; padding: 20px; text-align: center; }
h1 { margin-bottom: 30px; }
.game-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 20px; max-width: 800px; margin: 0 auto; }
.game-card { background: white; color: #333; padding: 20px; border-radius: 10px; cursor: pointer; font-weight: bold; }
.game-card:hover { background: #f0f0f0; }
#canvas { background: black; display: block; margin: 20px auto; border: 2px solid white; }
#info { background: rgba(255,255,255,0.1); padding: 15px; border-radius: 10px; margin-top: 20px; }
</style>
</head>
<body>
<h1>🎮 Games</h1>
<div class="game-grid" id="menu">
<div class="game-card" onclick="startSnake()">🐍 Snake</div>
<div class="game-card" onclick="startFlappy()">🐦 Flappy</div>
<div class="game-card" onclick="startPong()">🏓 Pong</div>
<div class="game-card" onclick="startTag()">🏃 Tag</div>
</div>
<canvas id="canvas" width="400" height="400" style="display:none;"></canvas>
<div id="info"></div>

<script>
let gameState = null;
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const info = document.getElementById('info');

function startSnake() {
  canvas.style.display = 'block';
  canvas.width = 400;
  canvas.height = 400;
  info.textContent = '🐍 Arrow Keys to move';
  document.getElementById('menu').style.display = 'none';
  
  gameState = {
    type: 'snake',
    snake: [{x:10,y:10}],
    food: {x:15,y:15},
    dx: 1,
    dy: 0,
    score: 0
  };
  
  document.onkeydown = (e) => {
    if(e.key === 'ArrowUp' && gameState.dy === 0) gameState.dx = 0, gameState.dy = -1;
    if(e.key === 'ArrowDown' && gameState.dy === 0) gameState.dx = 0, gameState.dy = 1;
    if(e.key === 'ArrowLeft' && gameState.dx === 0) gameState.dx = -1, gameState.dy = 0;
    if(e.key === 'ArrowRight' && gameState.dx === 0) gameState.dx = 1, gameState.dy = 0;
  };
  
  updateSnake();
}

function updateSnake() {
  if(!gameState || gameState.type !== 'snake') return;
  
  let h = {x:gameState.snake[0].x+gameState.dx, y:gameState.snake[0].y+gameState.dy};
  
  if(h.x < 0 || h.x > 19 || h.y < 0 || h.y > 19 || gameState.snake.some(s=>s.x===h.x&&s.y===h.y)) {
    alert('Score: ' + gameState.score);
    resetMenu();
    return;
  }
  
  gameState.snake.unshift(h);
  
  if(h.x === gameState.food.x && h.y === gameState.food.y) {
    gameState.score++;
    gameState.food = {x:Math.floor(Math.random()*20), y:Math.floor(Math.random()*20)};
  } else {
    gameState.snake.pop();
  }
  
  ctx.fillStyle = '#000';
  ctx.fillRect(0,0,400,400);
  ctx.fillStyle = '#0f0';
  gameState.snake.forEach(s => ctx.fillRect(s.x*20+1, s.y*20+1, 18, 18));
  ctx.fillStyle = '#f00';
  ctx.fillRect(gameState.food.x*20+1, gameState.food.y*20+1, 18, 18);
  ctx.fillStyle = '#fff';
  ctx.font = '16px Arial';
  ctx.fillText('Score: ' + gameState.score, 10, 25);
  
  setTimeout(updateSnake, 100);
}

function startFlappy() {
  canvas.style.display = 'block';
  canvas.width = 400;
  canvas.height = 600;
  info.textContent = '🐦 Click to jump';
  document.getElementById('menu').style.display = 'none';
  
  gameState = {
    type: 'flappy',
    bird: {y:300, vel:0},
    pipes: [],
    score: 0
  };
  
  document.onmousedown = () => { if(gameState && gameState.type === 'flappy') gameState.bird.vel = -12; };
  document.onkeydown = (e) => { if(e.code === 'Space') gameState.bird.vel = -12; };
  
  updateFlappy();
}

function updateFlappy() {
  if(!gameState || gameState.type !== 'flappy') return;
  
  gameState.bird.vel += 0.6;
  gameState.bird.y += gameState.bird.vel;
  
  if(gameState.bird.y > 600 || gameState.bird.y < 0) {
    alert('Score: ' + gameState.score);
    resetMenu();
    return;
  }
  
  if(gameState.pipes.length === 0 || gameState.pipes[gameState.pipes.length-1].x < 150) {
    gameState.pipes.push({x:400, y:Math.random()*250+50});
  }
  
  gameState.pipes = gameState.pipes.filter(p => {
    p.x -= 5;
    if(p.x + 60 < 0) { gameState.score++; return false; }
    if(50 > p.x && 50 < p.x+60) {
      if(gameState.bird.y < p.y || gameState.bird.y > p.y+120) {
        alert('Score: ' + gameState.score);
        resetMenu();
      }
    }
    return true;
  });
  
  ctx.fillStyle = '#87ceeb';
  ctx.fillRect(0,0,400,600);
  ctx.fillStyle = '#228b22';
  gameState.pipes.forEach(p => {
    ctx.fillRect(p.x, 0, 60, p.y);
    ctx.fillRect(p.x, p.y+120, 60, 600);
  });
  ctx.fillStyle = '#ffeb3b';
  ctx.fillRect(40, gameState.bird.y-10, 20, 20);
  ctx.fillStyle = '#fff';
  ctx.font = '20px Arial';
  ctx.fillText('Score: ' + gameState.score, 20, 40);
  
  setTimeout(updateFlappy, 30);
}

function startPong() {
  canvas.style.display = 'block';
  canvas.width = 600;
  canvas.height = 400;
  info.textContent = '🏓 P1: W/S | P2: ↑/↓';
  document.getElementById('menu').style.display = 'none';
  
  gameState = {
    type: 'pong',
    p1: {y:175, h:50},
    p2: {y:175, h:50},
    ball: {x:300, y:200, vx:4, vy:4, r:8},
    score: [0,0],
    keys: {}
  };
  
  document.onkeydown = (e) => { gameState.keys[e.key] = true; };
  document.onkeyup = (e) => { gameState.keys[e.key] = false; };
  
  updatePong();
}

function updatePong() {
  if(!gameState || gameState.type !== 'pong') return;
  
  if(gameState.keys['w'] && gameState.p1.y > 0) gameState.p1.y -= 6;
  if(gameState.keys['s'] && gameState.p1.y + gameState.p1.h < 400) gameState.p1.y += 6;
  if(gameState.keys['ArrowUp'] && gameState.p2.y > 0) gameState.p2.y -= 6;
  if(gameState.keys['ArrowDown'] && gameState.p2.y + gameState.p2.h < 400) gameState.p2.y += 6;
  
  gameState.ball.x += gameState.ball.vx;
  gameState.ball.y += gameState.ball.vy;
  
  if(gameState.ball.y < gameState.ball.r || gameState.ball.y > 400-gameState.ball.r) gameState.ball.vy *= -1;
  if(gameState.ball.x < 20 && gameState.ball.y > gameState.p1.y && gameState.ball.y < gameState.p1.y+gameState.p1.h) gameState.ball.vx *= -1;
  if(gameState.ball.x > 580 && gameState.ball.y > gameState.p2.y && gameState.ball.y < gameState.p2.y+gameState.p2.h) gameState.ball.vx *= -1;
  
  if(gameState.ball.x < 0) {gameState.score[1]++; gameState.ball = {x:300, y:200, vx:4, vy:4, r:8};}
  if(gameState.ball.x > 600) {gameState.score[0]++; gameState.ball = {x:300, y:200, vx:4, vy:4, r:8};}
  
  ctx.fillStyle = '#000';
  ctx.fillRect(0,0,600,400);
  ctx.fillStyle = '#fff';
  ctx.fillRect(10, gameState.p1.y, 10, gameState.p1.h);
  ctx.fillRect(580, gameState.p2.y, 10, gameState.p2.h);
  ctx.beginPath();
  ctx.arc(gameState.ball.x, gameState.ball.y, gameState.ball.r, 0, Math.PI*2);
  ctx.fill();
  ctx.font = '24px Arial';
  ctx.fillText(gameState.score[0], 100, 50);
  ctx.fillText(gameState.score[1], 500, 50);
  
  setTimeout(updatePong, 30);
}

function startTag() {
  canvas.style.display = 'block';
  canvas.width = 600;
  canvas.height = 400;
  info.textContent = '🏃 P1:WASD P2:↑↓←→ P3:IJKL P4:Numpad';
  document.getElementById('menu').style.display = 'none';
  
  gameState = {
    type: 'tag',
    players: [
      {x:50, y:180, size:20, color:'#ff4444', keys:{up:'w',down:'s',left:'a',right:'d'}},
      {x:550, y:180, size:20, color:'#4444ff', keys:{up:'ArrowUp',down:'ArrowDown',left:'ArrowLeft',right:'ArrowRight'}},
      {x:150, y:300, size:20, color:'#44ff44', keys:{up:'i',down:'k',left:'j',right:'l'}},
      {x:450, y:100, size:20, color:'#ffff44', keys:{up:'8',down:'2',left:'4',right:'6'}}
    ],
    keys: {},
    tagged: -1
  };
  
  document.onkeydown = (e) => { gameState.keys[e.key] = true; };
  document.onkeyup = (e) => { gameState.keys[e.key] = false; };
  
  updateTag();
}

function updateTag() {
  if(!gameState || gameState.type !== 'tag') return;
  
  gameState.players.forEach(p => {
    if(gameState.keys[p.keys.left] && p.x > 0) p.x -= 4;
    if(gameState.keys[p.keys.right] && p.x < 580) p.x += 4;
    if(gameState.keys[p.keys.up] && p.y > 0) p.y -= 4;
    if(gameState.keys[p.keys.down] && p.y < 380) p.y += 4;
  });
  
  gameState.tagged = -1;
  for(let i = 0; i < gameState.players.length; i++) {
    for(let j = i+1; j < gameState.players.length; j++) {
      let dx = gameState.players[i].x - gameState.players[j].x;
      let dy = gameState.players[i].y - gameState.players[j].y;
      if(dx*dx + dy*dy < 1600) {
        gameState.tagged = Math.random() > 0.5 ? i : j;
      }
    }
  }
  
  ctx.fillStyle = '#000';
  ctx.fillRect(0,0,600,400);
  gameState.players.forEach((p,i) => {
    ctx.fillStyle = (i === gameState.tagged) ? '#ff0000' : p.color;
    ctx.fillRect(p.x, p.y, p.size, p.size);
  });
  ctx.fillStyle = '#fff';
  ctx.font = '14px Arial';
  ctx.fillText('P1:Red P2:Blue P3:Green P4:Yellow', 20, 30);
  if(gameState.tagged >= 0) ctx.fillText('P'+(gameState.tagged+1)+' IS TAGGED!', 250, 30);
  
  setTimeout(updateTag, 30);
}

function resetMenu() {
  gameState = null;
  canvas.style.display = 'none';
  document.getElementById('menu').style.display = 'grid';
  info.textContent = '';
  document.onkeydown = null;
  document.onmousedown = null;
}
</script>
</body>
</html>
