<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Hub Pro</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }
        
        header h1 {
            font-size: 3em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }
        
        .game-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        .game-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 20px rgba(0,0,0,0.2);
        }
        
        .game-image {
            width: 100%;
            height: 200px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3em;
        }
        
        .game-info {
            padding: 15px;
        }
        
        .game-info h3 {
            margin-bottom: 8px;
            color: #333;
        }
        
        .game-info p {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 12px;
        }
        
        .play-btn {
            width: 100%;
            padding: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: opacity 0.2s;
        }
        
        .play-btn:hover {
            opacity: 0.9;
        }
        
        .play-btn:active {
            transform: scale(0.98);
        }
        
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.7);
            animation: fadeIn 0.3s ease;
        }
        
        .modal.show {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .modal-content {
            background-color: white;
            padding: 20px;
            border-radius: 12px;
            width: 90%;
            max-width: 900px;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 15px;
        }
        
        .modal-header h2 {
            color: #333;
        }
        
        .close {
            font-size: 28px;
            font-weight: bold;
            color: #aaa;
            cursor: pointer;
            transition: color 0.2s;
        }
        
        .close:hover {
            color: #000;
        }
        
        .game-container {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: auto;
        }
        
        canvas {
            max-width: 100%;
            border: 2px solid #333;
            border-radius: 8px;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎮 Game Hub Pro</h1>
            <p>Classic games that actually work!</p>
        </header>
        
        <div class="game-grid" id="gameGrid"></div>
    </div>
    
    <div id="gameModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="gameTitle"></h2>
                <span class="close">&times;</span>
            </div>
            <div class="game-container" id="gameContainer"></div>
        </div>
    </div>
    
    <script>
        const games = [
            {
                name: "Snake",
                emoji: "🐍",
                description: "Eat food, grow longer, don't crash!",
                id: "snake"
            },
            {
                name: "Flappy Bird",
                emoji: "🐦",
                description: "Tap to fly through pipes",
                id: "flappy"
            },
            {
                name: "Pong",
                emoji: "🏓",
                description: "Classic multiplayer arcade",
                id: "pong"
            },
            {
                name: "Breakout",
                emoji: "🧱",
                description: "Break bricks with a ball",
                id: "breakout"
            }
        ];
        
        const gameGrid = document.getElementById('gameGrid');
        const modal = document.getElementById('gameModal');
        const closeBtn = document.querySelector('.close');
        const gameContainer = document.getElementById('gameContainer');
        const gameTitle = document.getElementById('gameTitle');
        
        let currentGame = null;
        
        games.forEach(game => {
            const card = document.createElement('div');
            card.className = 'game-card';
            card.innerHTML = `
                <div class="game-image">${game.emoji}</div>
                <div class="game-info">
                    <h3>${game.name}</h3>
                    <p>${game.description}</p>
                    <button class="play-btn" data-game="${game.id}">Play Now</button>
                </div>
            `;
            card.querySelector('.play-btn').onclick = () => startGame(game);
            gameGrid.appendChild(card);
        });
        
        function startGame(game) {
            gameTitle.textContent = game.name;
            gameContainer.innerHTML = '';
            modal.classList.add('show');
            currentGame = game.id;
            
            if (game.id === 'snake') initSnake();
            else if (game.id === 'flappy') initFlappy();
            else if (game.id === 'pong') initPong();
            else if (game.id === 'breakout') initBreakout();
        }
        
        // ===== SNAKE GAME =====
        function initSnake() {
            const canvas = document.createElement('canvas');
            canvas.width = 400;
            canvas.height = 400;
            gameContainer.appendChild(canvas);
            
            const ctx = canvas.getContext('2d');
            const grid = 20;
            const tileCount = canvas.width / grid;
            
            let snake = [{x: 10, y: 10}];
            let food = {x: Math.floor(Math.random() * tileCount), y: Math.floor(Math.random() * tileCount)};
            let dx = 1, dy = 0;
            let score = 0;
            let gameRunning = true;
            
            const scoreDisplay = document.createElement('p');
            scoreDisplay.style.cssText = 'text-align:center;font-size:18px;color:#333;margin-top:10px;';
            scoreDisplay.textContent = `Score: ${score}`;
            gameContainer.appendChild(scoreDisplay);
            
            document.onkeydown = (e) => {
                if (e.key === 'ArrowUp' && dy === 0) {dx = 0; dy = -1; e.preventDefault();}
                else if (e.key === 'ArrowDown' && dy === 0) {dx = 0; dy = 1; e.preventDefault();}
                else if (e.key === 'ArrowLeft' && dx === 0) {dx = -1; dy = 0; e.preventDefault();}
                else if (e.key === 'ArrowRight' && dx === 0) {dx = 1; dy = 0; e.preventDefault();}
            };
            
            function update() {
                const head = {x: snake[0].x + dx, y: snake[0].y + dy};
                
                // Wall collision
                if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                    gameRunning = false;
                    alert(`Game Over! Final Score: ${score}`);
                    return;
                }
                
                // Self collision
                for (let segment of snake) {
                    if (head.x === segment.x && head.y === segment.y) {
                        gameRunning = false;
                        alert(`Game Over! Final Score: ${score}`);
                        return;
                    }
                }
                
                snake.unshift(head);
                
                // Food collision
                if (head.x === food.x && head.y === food.y) {
                    score += 10;
                    scoreDisplay.textContent = `Score: ${score}`;
                    food = {x: Math.floor(Math.random() * tileCount), y: Math.floor(Math.random() * tileCount)};
                } else {
                    snake.pop();
                }
            }
            
            function draw() {
                // Background
                ctx.fillStyle = '#1a1a1a';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                // Grid
                ctx.strokeStyle = '#333';
                ctx.lineWidth = 0.5;
                for (let i = 0; i <= tileCount; i++) {
                    ctx.beginPath();
                    ctx.moveTo(i * grid, 0);
                    ctx.lineTo(i * grid, canvas.height);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(0, i * grid);
                    ctx.lineTo(canvas.width, i * grid);
                    ctx.stroke();
                }
                
                // Snake
                ctx.fillStyle = '#00ff00';
                snake.forEach((segment, index) => {
                    ctx.fillRect(segment.x * grid + 1, segment.y * grid + 1, grid - 2, grid - 2);
                    if (index === 0) {
                        ctx.fillStyle = '#00ff88';
                    }
                });
                
                // Food
                ctx.fillStyle = '#ff4444';
                ctx.beginPath();
                ctx.arc(food.x * grid + grid/2, food.y * grid + grid/2, grid/2 - 2, 0, Math.PI * 2);
                ctx.fill();
            }
            
            const gameLoop = setInterval(() => {
                if (!gameRunning) {
                    clearInterval(gameLoop);
                    return;
                }
                update();
                draw();
            }, 80);
        }
        
        // ===== FLAPPY BIRD GAME =====
        function initFlappy() {
            const canvas = document.createElement('canvas');
            canvas.width = 400;
            canvas.height = 600;
            gameContainer.appendChild(canvas);
            
            const ctx = canvas.getContext('2d');
            
            let bird = {x: 50, y: 300, width: 30, height: 24, vel: 0, angle: 0};
            let pipes = [];
            let score = 0;
            let gameRunning = true;
            const gravity = 0.6;
            const jumpPower = -15;
            const pipeSpeed = 4;
            const pipeGap = 140;
            
            const scoreDisplay = document.createElement('p');
            scoreDisplay.style.cssText = 'text-align:center;font-size:18px;color:#333;margin-top:10px;';
            scoreDisplay.textContent = `Score: ${score}`;
            gameContainer.appendChild(scoreDisplay);
            
            const jump = () => {
                if (gameRunning) {
                    bird.vel = jumpPower;
                    bird.angle = -25;
                }
            };
            
            document.onkeydown = (e) => {
                if (e.code === 'Space') { jump(); e.preventDefault(); }
            };
            document.onmousedown = jump;
            canvas.ontouchstart = jump;
            
            function update() {
                bird.vel += gravity;
                bird.y += bird.vel;
                bird.angle = Math.min(90, bird.angle + 2);
                
                // Ceiling and ground
                if (bird.y < 0 || bird.y + bird.height > canvas.height) {
                    gameRunning = false;
                    alert(`Game Over! Score: ${score}`);
                    return;
                }
                
                // Generate pipes
                if (pipes.length === 0 || pipes[pipes.length - 1].x < canvas.width - 200) {
                    const pipeY = Math.random() * (canvas.height - pipeGap - 100) + 50;
                    pipes.push({x: canvas.width, y: pipeY});
                }
                
                // Move and check pipes
                for (let i = pipes.length - 1; i >= 0; i--) {
                    pipes[i].x -= pipeSpeed;
                    
                    if (pipes[i].x + 60 < 0) {
                        pipes.splice(i, 1);
                        score++;
                        scoreDisplay.textContent = `Score: ${score}`;
                    } else {
                        // Collision detection
                        if (bird.x + bird.width > pipes[i].x && bird.x < pipes[i].x + 60) {
                            if (bird.y < pipes[i].y || bird.y + bird.height > pipes[i].y + pipeGap) {
                                gameRunning = false;
                                alert(`Game Over! Score: ${score}`);
                                return;
                            }
                        }
                    }
                }
            }
            
            function draw() {
                // Sky
                ctx.fillStyle = '#87ceeb';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                // Ground
                ctx.fillStyle = '#90EE90';
                ctx.fillRect(0, canvas.height - 40, canvas.width, 40);
                
                // Pipes
                ctx.fillStyle = '#228b22';
                pipes.forEach(pipe => {
                    ctx.fillRect(pipe.x, 0, 60, pipe.y);
                    ctx.fillRect(pipe.x, pipe.y + pipeGap, 60, canvas.height - pipe.y - pipeGap - 40);
                });
                
                // Bird
                ctx.save();
                ctx.translate(bird.x + bird.width/2, bird.y + bird.height/2);
                ctx.rotate(bird.angle * Math.PI / 180);
                ctx.fillStyle = '#ffeb3b';
                ctx.fillRect(-bird.width/2, -bird.height/2, bird.width, bird.height);
                ctx.fillStyle = '#000';
                ctx.fillRect(bird.width/4, -bird.height/4, 4, 4);
                ctx.restore();
            }
            
            const gameLoop = setInterval(() => {
                if (!gameRunning) {
                    clearInterval(gameLoop);
                    return;
                }
                update();
                draw();
            }, 30);
        }
        
        // ===== PONG GAME =====
        function initPong() {
            const canvas = document.createElement('canvas');
            canvas.width = 600;
            canvas.height = 400;
            gameContainer.appendChild(canvas);
            
            const ctx = canvas.getContext('2d');
            
            let paddles = [
                {x: 10, y: 180, width: 15, height: 60, vel: 0},
                {x: 575, y: 180, width: 15, height: 60, vel: 0}
            ];
            
            let ball = {x: 300, y: 200, radius: 8, vx: 4, vy: 4};
            let scores = [0, 0];
            let gameRunning = true;
            
            const scoreDisplay = document.createElement('p');
            scoreDisplay.style.cssText = 'text-align:center;font-size:18px;color:#333;margin-top:10px;';
            const updateScore = () => { scoreDisplay.textContent = `Player 1: ${scores[0]}  |  Player 2: ${scores[1]}`; };
            updateScore();
            gameContainer.appendChild(scoreDisplay);
            
            let keys = {};
            document.onkeydown = (e) => {keys[e.key] = true;};
            document.onkeyup = (e) => {keys[e.key] = false;};
            
            function update() {
                // Paddle movement
                if (keys['w'] && paddles[0].y > 0) paddles[0].y -= 6;
                if (keys['s'] && paddles[0].y + paddles[0].height < canvas.height) paddles[0].y += 6;
                if (keys['ArrowUp'] && paddles[1].y > 0) paddles[1].y -= 6;
                if (keys['ArrowDown'] && paddles[1].y + paddles[1].height < canvas.height) paddles[1].y += 6;
                
                // Ball movement
                ball.x += ball.vx;
                ball.y += ball.vy;
                
                // Top/bottom collision
                if (ball.y - ball.radius < 0 || ball.y + ball.radius > canvas.height) {
                    ball.vy *= -1;
                    ball.y = Math.max(ball.radius, Math.min(canvas.height - ball.radius, ball.y));
                }
                
                // Paddle collision
                paddles.forEach((paddle, i) => {
                    if (ball.x - ball.radius < paddle.x + paddle.width && 
                        ball.x + ball.radius > paddle.x &&
                        ball.y > paddle.y && 
                        ball.y < paddle.y + paddle.height) {
                        ball.vx *= -1.05;
                        let hitPos = (ball.y - (paddle.y + paddle.height/2)) / (paddle.height/2);
                        ball.vy += hitPos * 3;
                        ball.x = i === 0 ? paddle.x + paddle.width + ball.radius : paddle.x - ball.radius;
                    }
                });
                
                // Score
                if (ball.x < 0) {
                    scores[1]++;
                    updateScore();
                    ball = {x: 300, y: 200, radius: 8, vx: 4, vy: 4};
                }
                if (ball.x > canvas.width) {
                    scores[0]++;
                    updateScore();
                    ball = {x: 300, y: 200, radius: 8, vx: -4, vy: 4};
                }
            }
            
            function draw() {
                // Background
                ctx.fillStyle = '#1a1a1a';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                // Center line
                ctx.strokeStyle = '#fff';
                ctx.setLineDash([10, 10]);
                ctx.beginPath();
                ctx.moveTo(canvas.width/2, 0);
                ctx.lineTo(canvas.width/2, canvas.height);
                ctx.stroke();
                ctx.setLineDash([]);
                
                // Paddles
                ctx.fillStyle = '#fff';
                paddles.forEach(p => ctx.fillRect(p.x, p.y, p.width, p.height));
                
                // Ball
                ctx.fillStyle = '#ffeb3b';
                ctx.beginPath();
                ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
                ctx.fill();
            }
            
            const gameInfo = document.createElement('p');
            gameInfo.style.cssText = 'text-align:center;font-size:12px;color:#666;margin-top:5px;';
            gameInfo.textContent = 'P1: W/S keys | P2: Arrow keys';
            gameContainer.appendChild(gameInfo);
            
            const gameLoop = setInterval(() => {
                if (!gameRunning) {
                    clearInterval(gameLoop);
                    return;
                }
                update();
                draw();
            }, 30);
        }
        
        // ===== BREAKOUT GAME =====
        function initBreakout() {
            const canvas = document.createElement('canvas');
            canvas.width = 500;
            canvas.height = 600;
            gameContainer.appendChild(canvas);
            
            const ctx = canvas.getContext('2d');
            
            let paddle = {x: 225, y: 560, width: 50, height: 15};
            let ball = {x: 250, y: 545, radius: 6, vx: 3, vy: -3};
            let bricks = [];
            let score = 0;
            let gameRunning = true;
            
            // Create bricks
            const brickRows = 4;
            const brickCols = 8;
            const brickWidth = 50;
            const brickHeight = 15;
            for (let r = 0; r < brickRows; r++) {
                for (let c = 0; c < brickCols; c++) {
                    bricks.push({
                        x: 20 + c * (brickWidth + 10),
                        y: 40 + r * (brickHeight + 10),
                        width: brickWidth,
                        height: brickHeight,
                        active: true
                    });
                }
            }
            
            const scoreDisplay = document.createElement('p');
            scoreDisplay.style.cssText = 'text-align:center;font-size:18px;color:#333;margin-top:10px;';
            scoreDisplay.textContent = `Score: ${score} | Bricks: ${bricks.length}`;
            gameContainer.appendChild(scoreDisplay);
            
            let mouseX = canvas.width / 2;
            document.onmousemove = (e) => {
                const rect = canvas.getBoundingClientRect();
                mouseX = e.clientX - rect.left;
            };
            
            function update() {
                paddle.x = Math.max(0, Math.min(canvas.width - paddle.width, mouseX - paddle.width/2));
                
                ball.x += ball.vx;
                ball.y += ball.vy;
                
                // Wall collision
                if (ball.x - ball.radius < 0 || ball.x + ball.radius > canvas.width) {
                    ball.vx *= -1;
                }
                if (ball.y - ball.radius < 0) {
                    ball.vy *= -1;
                }
                
                // Paddle collision
                if (ball.y + ball.radius > paddle.y && 
                    ball.y - ball.radius < paddle.y + paddle.height &&
                    ball.x > paddle.x && 
                    ball.x < paddle.x + paddle.width) {
                    ball.vy *= -1;
                    let hitPos = (ball.x - paddle.x) / paddle.width;
                    ball.vx = (hitPos - 0.5) * 8;
                }
                
                // Lose
                if (ball.y > canvas.height) {
                    gameRunning = false;
                    alert(`Game Over! Score: ${score}`);
                }
                
                // Brick collision
                bricks.forEach(brick => {
                    if (!brick.active) return;
                    
                    if (ball.x > brick.x && ball.x < brick.x + brick.width &&
                        ball.y > brick.y && ball.y < brick.y + brick.height) {
                        brick.active = false;
                        score += 10;
                        scoreDisplay.textContent = `Score: ${score} | Bricks: ${bricks.filter(b => b.active).length}`;
                        ball.vy *= -1;
                    }
                });
                
                // Win
                if (bricks.every(b => !b.active)) {
                    gameRunning = false;
                    alert(`You Win! Score: ${score}`);
                }
            }
            
            function draw() {
                // Background
                ctx.fillStyle = '#1a1a1a';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                // Bricks
                const colors = ['#ff6b6b', '#ee5a6f', '#f06a5d', '#fc7753'];
                bricks.forEach((brick, i) => {
                    if (brick.active) {
                        ctx.fillStyle = colors[Math.floor(i / brickCols) % colors.length];
                        ctx.fillRect(brick.x, brick.y, brick.width, brick.height);
                        ctx.strokeStyle = '#000';
                        ctx.lineWidth = 1;
                        ctx.strokeRect(brick.x, brick.y, brick.width, brick.height);
                    }
                });
                
                // Paddle
                ctx.fillStyle = '#00ff88';
                ctx.fillRect(paddle.x, paddle.y, paddle.width, paddle.height);
                
                // Ball
                ctx.fillStyle = '#ffeb3b';
                ctx.beginPath();
                ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
                ctx.fill();
            }
            
            const gameLoop = setInterval(() => {
                if (!gameRunning) {
                    clearInterval(gameLoop);
                    return;
                }
                update();
                draw();
            }, 30);
        }
        
        closeBtn.onclick = () => {
            modal.classList.remove('show');
            document.onkeydown = null;
            document.onmousedown = null;
            document.onmousemove = null;
            canvas.ontouchstart = null;
        };
        
        window.onclick = (e) => {
            if (e.target === modal) {
                modal.classList.remove('show');
                document.onkeydown = null;
                document.onmousedown = null;
                document.onmousemove = null;
                canvas.ontouchstart = null;
            }
        };
    </script>
</body>
</html>
